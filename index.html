<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador RPG</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="jogo">
        <h1>A Floresta Sombria</h1>

        <p id="historia">
            Você está andando por uma floresta quando encontra um monstro no caminho.
            O que você deseja fazer?
        </p>

        <div id="opcoes">
            <button onclick="atacar()">Atacar</button>
            <button onclick="fugir()">Fugir</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
